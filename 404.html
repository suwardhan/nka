<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Not found · Narendra Ahirrao and Associates</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // GitHub Pages only serves this root 404.html for missing paths.
      // Re-route /admin/* into the SPA so BrowserRouter deep links work on refresh.
      // Pattern: https://github.com/rafgraph/spa-github-pages
      ;(function () {
        var path = location.pathname
        var isAdmin =
          path === '/admin' || path === '/admin/' || path.indexOf('/admin/') === 0

        if (!isAdmin) {
          return
        }

        var pathSegmentsToKeep = 1
        var l = window.location
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search
              ? '&' + l.search.slice(1).replace(/&/g, '~and~')
              : '') +
            l.hash,
        )
      })()
    </script>
    <style>
      body {
        font-family: Georgia, 'Times New Roman', serif;
        margin: 3rem auto;
        max-width: 32rem;
        padding: 0 1.25rem;
        color: #1a1a1a;
        line-height: 1.5;
      }
      a {
        color: #0b3d5c;
      }
    </style>
  </head>
  <body>
    <h1>Page not found</h1>
    <p>
      The page you requested does not exist.
      <a href="/">Return to the home page</a>.
    </p>
  </body>
</html>
